name: Build mod-yla base 🛠️

on:
  workflow_call:
    inputs:
      lua_version:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: "mod-yla-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  install_and_build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime
      CCACHE_CPP2: "true"
    steps:
      - name: Detect source changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" --paginate --jq '.[].filename')
          elif [ "${{ github.event_name }}" = "push" ]; then
            files=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" --jq '.files[].filename' || true)
          fi
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qiE '\.(c|cc|cpp|cxx|h|hh|hpp|sql)$|(^|/)CMakeLists\.txt$|\.cmake$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No source changes; skipping build."
          fi

      - name: Check out YggdrasilCore 🧑‍💻
        if: steps.changes.outputs.code == 'true'
        uses: actions/checkout@v4
        with:
          repository: 'yggdrasilcore/yggdrasilcore'
          ref: 'master'
          submodules: 'recursive'
          fetch-depth: 1

      - name: Check out module repository 📂
        if: steps.changes.outputs.code == 'true'
        uses: actions/checkout@v4
        with:
          path: 'modules/${{ github.event.repository.name }}'
          fetch-depth: 1

      - name: Check out mod-shadows 🤖
        if: steps.changes.outputs.code == 'true'
        uses: actions/checkout@v4
        with:
          repository: 'yggdrasilcore/mod-shadows'
          ref: 'master'
          path: 'modules/mod-shadows'
          fetch-depth: 1

      - name: Ccache 💾
        if: steps.changes.outputs.code == 'true'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: mod-yla-clang-18-${{ inputs.lua_version }}-${{ github.ref_name }}
          restore-keys: |
            mod-yla-clang-18-${{ inputs.lua_version }}
            mod-yla-clang-18
          max-size: 1000M

      - name: Install build dependencies 🧰
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ccache ninja-build cppcheck \
            libmysqlclient-dev libboost-all-dev libbz2-dev libncurses5-dev libmysql++-dev \
            libreadline6-dev libssl-dev libtool openssl zlib1g-dev

      - name: Build mod-yla with ${{ inputs.lua_version }} 🏗️
        if: steps.changes.outputs.code == 'true'
        run: |
          cmake -G Ninja -B build -S . \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DSCRIPTS="static" \
            -DMODULES="static" \
            -DWITH_WARNINGS="OFF" \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="ccache" \
            -DCMAKE_C_COMPILER_LAUNCHER="ccache" \
            -DCMAKE_C_FLAGS="-DMOD_PLAYERBOTS" \
            -DCMAKE_CXX_FLAGS="-DMOD_PLAYERBOTS" \
            -DLUA_VERSION=${{ inputs.lua_version }}
          cmake --build build --parallel $(nproc)

      - name: Run Cppcheck for static code analysis 🔍
        if: steps.changes.outputs.code == 'true'
        run: |
          cd modules/${{ github.event.repository.name }}
          cppcheck -j$(nproc) --force --inline-suppr \
            -I src/LuaEngine/ \
            -I src/ \
            --suppress=*:src/lualib/* \
            --suppress=*:src/LuaEngine/libs/* \
            --output-file=report.txt \
            .
          if [ -s report.txt ]; then
            echo "Cppcheck detected issues 🚨:"
            cat report.txt
            exit 1
          else
            echo "No issues detected by cppcheck ✅."
          fi
