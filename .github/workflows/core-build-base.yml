name: Build mod-yla base 🛠️

on:
  workflow_call:
    inputs:
      lua_version:
        required: true
        type: string

concurrency:
  group: "mod-yla-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  install_and_build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime
      CCACHE_CPP2: "true"
    steps:
      - name: Check out YggdrasilCore 🧑‍💻
        uses: actions/checkout@v4
        with:
          repository: 'YggdrasilWotLK/yggdrasilcore'
          ref: 'master-shadows'
          submodules: 'recursive'
          fetch-depth: 1

      - name: Check out module repository 📂
        uses: actions/checkout@v4
        with:
          path: 'modules/${{ github.event.repository.name }}'
          fetch-depth: 1

      - name: Check out mod-shadows 🤖
        uses: actions/checkout@v4
        with:
          repository: 'YggdrasilWotLK/mod-shadows'
          ref: 'master'
          path: 'modules/mod-shadows'
          fetch-depth: 1

      - name: Ccache 💾
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: mod-yla-clang-18-${{ inputs.lua_version }}-${{ github.ref_name }}
          restore-keys: |
            mod-yla-clang-18-${{ inputs.lua_version }}
            mod-yla-clang-18
          max-size: 1000M

      - name: Install build dependencies 🧰
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ccache ninja-build cppcheck \
            libmysqlclient-dev libboost-all-dev libbz2-dev libncurses5-dev libmysql++-dev \
            libreadline6-dev libssl-dev libtool openssl zlib1g-dev

      - name: Build mod-yla with ${{ inputs.lua_version }} 🏗️
        run: |
          cmake -G Ninja -B build -S . \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DSCRIPTS="static" \
            -DMODULES="static" \
            -DWITH_WARNINGS="OFF" \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="ccache" \
            -DCMAKE_C_COMPILER_LAUNCHER="ccache" \
            -DCMAKE_C_FLAGS="-DMOD_PLAYERBOTS" \
            -DCMAKE_CXX_FLAGS="-DMOD_PLAYERBOTS" \
            -DLUA_VERSION=${{ inputs.lua_version }}
          cmake --build build --parallel $(nproc)

      - name: Run Cppcheck for static code analysis 🔍
        run: |
          cd modules/${{ github.event.repository.name }}
          cppcheck -j$(nproc) --force --inline-suppr \
            -I src/LuaEngine/ \
            -I src/ \
            --suppress=*:src/lualib/* \
            --suppress=*:src/LuaEngine/libs/* \
            --output-file=report.txt \
            .
          if [ -s report.txt ]; then
            echo "Cppcheck detected issues 🚨:"
            cat report.txt
            exit 1
          else
            echo "No issues detected by cppcheck ✅."
          fi
