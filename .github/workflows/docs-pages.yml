name: Docs Pages Sync

# Rebuilds the static YLA API docs from the current method headers on every
# push to master-shadows and deploys them to GitHub Pages. The `web` branch
# holds the PHP docs site plus a `source/` snapshot (kept in sync by this
# workflow); built output is deployed as an artifact and never committed.
#
# Repo settings requirement: Pages source must be set to "GitHub Actions".
#
# NOTE: workflows only fire from the repo-root `.github/workflows`
# directory (the legacy copies under `src/LuaEngine/.github` never run).

on:
  push:
    branches:
      - master-shadows
  workflow_dispatch:

permissions:
  contents: write # push the source snapshot back to the web branch
  pages: write
  id-token: write

concurrency:
  group: docs-pages-sync
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out engine source
        uses: actions/checkout@v4

      - name: Check out pages branch
        uses: actions/checkout@v4
        with:
          ref: web
          path: site

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Sync method headers into site source
        run: |
          rm -rf site/source/yla
          mkdir -p site/source/yla/src/LuaEngine
          cp -r src/LuaEngine/methods site/source/yla/src/LuaEngine/methods

      - name: Rebuild static docs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd site
          php generate_github_docs.php
          mkdir -p docs
          cp -r dist/. docs/

      - name: Commit source snapshot to pages branch
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source
          if git diff --cached --quiet; then
            echo "No source changes detected"
          else
            git commit -m "Sync YLA API source from master-shadows @ ${GITHUB_SHA}"
            git push origin web
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
